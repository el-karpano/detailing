name = "detailing-autolava"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
main = "worker/index.js"

[[kv_namespaces]]
binding = "VISITS"
id = "9b9db4766eb84d6ea2c4250ba8f44eb3"

[[d1_databases]]
binding = "DB"
database_name = "detailing-autolava-db"
database_id = "200f9c5f-2ca7-403e-b3af-eb45685d171b"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
WORKER_NAME = "detailing-autolava"
STUDIO_ID = "studio-autolava"
