name = "detailing-testqa"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
main = "worker/index.js"

[[kv_namespaces]]
binding = "VISITS"
id = "9b9db4766eb84d6ea2c4250ba8f44eb3"

[[d1_databases]]
binding = "DB"
database_name = "detailing-testqa-db"
database_id = "5fff6aff-4210-4819-aafa-5ca1c91f151d"

[assets]
directory = "./dist"
